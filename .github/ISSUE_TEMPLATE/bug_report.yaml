name: "Bug Report (Low Priority)"
description: Create a public bug report. Note that these may not be addressed as quickly as helpdesk requests.
title: "[BUG]: "
labels: community, bug
body:
  - type: input
    attributes:
      label: Nginx Version(s)
      description: Version(s) of the Nginx Web Server affected by this bug.
      placeholder: 1.2.0
    validations:
      required: true

  - type: input
    attributes:
      label: Module Version(s)
      description: Version(s) of the DataDog Nginx module affected by this bug.
      placeholder: 1.2.0
    validations:
      required: true

  - type: textarea
    attributes:
      label: Bug Report
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction Code
      description: Code that helps us reproduce the problem.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Error Logs
      description: Any error logs from the module.
    validations:
      required: false

  - type: input
    attributes:
      label: Operating System
      description: Your operating system and version (e.g. `uname -a`).
      placeholder: Darwin Kernel Version 23.6.0
    validations:
      required: false
