# Run this before the matching dev publish job when testing the release path.
build-ingress-injection-images-dev:
  extends: .ingress-image-source
  dependencies:
    - "build-ingress-nginx-fast: [amd64, 1.13.9]"
    - "build-ingress-nginx-fast: [amd64, 1.14.5]"
    - "build-ingress-nginx-fast: [amd64, 1.15.1]"
    - "build-ingress-nginx-fast: [arm64, 1.13.9]"
    - "build-ingress-nginx-fast: [arm64, 1.14.5]"
    - "build-ingress-nginx-fast: [arm64, 1.15.1]"
  variables:
    INGRESS_IMAGE_RELEASE_MODE: dev
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
    - when: never

.ingress-image-publish:
  stage: ingress-image-publish
  image: registry.ddbuild.io/agent-delivery/dd-pkg:v0.9.4@sha256:eaf703c35f95d7326be30ffb485d143262de6b0a254b6f7f00f1573ec1817031
  tags: ["arch:amd64"]
  variables:
    INGRESS_IMAGE_PUBLIC_REGISTRIES: dockerhub
  script:
    - |
      set -euo pipefail
      amd64_versions=ingress-image-manifest/amd64/versions
      arm64_versions=ingress-image-manifest/arm64/versions
      test -s "${amd64_versions}"
      test -s "${arm64_versions}"
      diff -u "${amd64_versions}" "${arm64_versions}"

      case "${INGRESS_IMAGE_RELEASE_MODE}" in
        release) tag_suffix="dd.${CI_COMMIT_TAG}" ;;
        dev) tag_suffix="dev.${CI_COMMIT_SHORT_SHA}" ;;
        *) echo "Unknown release mode: ${INGRESS_IMAGE_RELEASE_MODE}" >&2; exit 1 ;;
      esac

      source_repository="${CI_REGISTRY}/ingress-nginx-injection"
      while read -r version; do
        image_tag="v${version}-${tag_suffix}"
        sources="${source_repository}:${image_tag}-amd64,${source_repository}:${image_tag}-arm64"
        if [[ "${INGRESS_IMAGE_RELEASE_MODE}" == release ]]; then
          destinations="ingress-nginx-injection:${image_tag},ingress-nginx-injection:v${version}"
        else
          destinations="ingress-nginx-injection-dev:${image_tag}"
        fi
        dd-pkg publish-image \
          --sources "${sources}" \
          --destinations "${destinations}" \
          --registries "${INGRESS_IMAGE_PUBLIC_REGISTRIES}"
      done < "${amd64_versions}"

publish-ingress-injection-images:
  extends: .ingress-image-publish
  dependencies:
    - "build-ingress-injection-images: [amd64]"
    - "build-ingress-injection-images: [arm64]"
  variables:
    INGRESS_IMAGE_RELEASE_MODE: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
    - when: never

publish-ingress-injection-images-dev:
  extends: .ingress-image-publish
  dependencies:
    - "build-ingress-injection-images-dev: [amd64]"
    - "build-ingress-injection-images-dev: [arm64]"
  variables:
    INGRESS_IMAGE_RELEASE_MODE: dev
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
    - when: never
