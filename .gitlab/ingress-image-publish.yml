# Use the same build and signing path for branch images.
build-ingress-injection-images-dev:
  extends: .ingress-image-source
  dependencies:
    - "build-ingress-nginx-fast: [amd64, 1.13.9]"
    - "build-ingress-nginx-fast: [amd64, 1.14.5]"
    - "build-ingress-nginx-fast: [amd64, 1.15.1]"
    - "build-ingress-nginx-fast: [arm64, 1.13.9]"
    - "build-ingress-nginx-fast: [arm64, 1.14.5]"
    - "build-ingress-nginx-fast: [arm64, 1.15.1]"
  rules:
    - if: $CI_COMMIT_BRANCH
    - when: never

.ingress-image-publish:
  stage: ingress-image-publish
  image: registry.ddbuild.io/agent-delivery/dd-pkg:v0.9.4@sha256:eaf703c35f95d7326be30ffb485d143262de6b0a254b6f7f00f1573ec1817031
  tags: ["arch:amd64"]
  interruptible: false
  resource_group: ingress-image-publish-$INGRESS_IMAGE_RELEASE_MODE
  timeout: 3 hours
  variables:
    INGRESS_IMAGE_PUBLIC_REGISTRIES: dockerhub
  script:
    - |
      set -euo pipefail
      : "${INGRESS_IMAGE_TAGS:?The signed image build must succeed first}"
      source_repository="${CI_REGISTRY}/ingress-nginx-injection"
      for image_tag in ${INGRESS_IMAGE_TAGS}; do
        version="${image_tag%@*}"
        version="${version%-*}"
        if [[ "${INGRESS_IMAGE_RELEASE_MODE}" == release ]]; then
          destinations="ingress-nginx-injection:${version}-dd.${CI_COMMIT_TAG},ingress-nginx-injection:${version}"
        else
          destinations="ingress-nginx-injection-dev:${version}-dev.${CI_COMMIT_SHORT_SHA}"
        fi
        dd-pkg publish-image \
          --sources "${source_repository}:${image_tag}" \
          --merge-strategy none \
          --destinations "${destinations}" \
          --registries "${INGRESS_IMAGE_PUBLIC_REGISTRIES}"
      done

publish-ingress-injection-images:
  extends: .ingress-image-publish
  dependencies: [build-ingress-injection-images]
  variables:
    INGRESS_IMAGE_RELEASE_MODE: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: manual
    - when: never

publish-ingress-injection-images-dev:
  extends: .ingress-image-publish
  dependencies: [build-ingress-injection-images-dev]
  variables:
    INGRESS_IMAGE_RELEASE_MODE: dev
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
    - when: never
