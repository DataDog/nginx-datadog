# Build and sign in the internal registry.
# Build both architectures, then sign and verify the multi-architecture digest.
.ingress-image-source:
  stage: ingress-image-build
  image: $NYDUS_IMAGE
  tags: ["docker-in-docker:amd64"]
  interruptible: false
  variables:
    CI_ENABLE_CONTAINER_IMAGE_BUILDS: "true"
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  script:
    - bin/build_ingress_images.sh ingress-images.env
  artifacts:
    reports:
      dotenv: ingress-images.env
    expire_in: 1 week

build-ingress-injection-images:
  extends: .ingress-image-source
  dependencies: [build-ingress-nginx-all]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - when: never

# Build and sign the fast test versions on branches.
build-ingress-injection-images-dev:
  extends: .ingress-image-source
  interruptible: true
  needs: [build-ingress-nginx-fast]
  rules:
    - if: $CI_COMMIT_BRANCH
    - when: never

.ingress-image-publish:
  stage: ingress-image-publish
  image: registry.ddbuild.io/agent-delivery/dd-pkg:v0.9.4@sha256:eaf703c35f95d7326be30ffb485d143262de6b0a254b6f7f00f1573ec1817031
  tags: ["arch:amd64"]
  interruptible: false
  resource_group: ingress-image-publish-$INGRESS_IMAGE_RELEASE_MODE
  timeout: 3 hours
  variables:
    INGRESS_IMAGE_PUBLIC_REGISTRIES: dockerhub
  script:
    - |
      set -euo pipefail
      : "${INGRESS_IMAGE_TAGS:?The signed image build must succeed first}"
      for image_tag in ${INGRESS_IMAGE_TAGS}; do
        tag_without_digest="${image_tag%@*}"
        version="${tag_without_digest%-*}"
        if [[ "${INGRESS_IMAGE_RELEASE_MODE}" == release ]]; then
          destinations="ingress-nginx-injection:${version}-dd.${CI_COMMIT_TAG},ingress-nginx-injection:${version}"
        else
          destinations="ingress-nginx-injection-dev:${version}-dev.${CI_COMMIT_SHORT_SHA}"
        fi
        dd-pkg publish-image \
          --sources "${INGRESS_IMAGE_SOURCE_REPOSITORY}:${image_tag}" \
          --merge-strategy none \
          --destinations "${destinations}" \
          --registries "${INGRESS_IMAGE_PUBLIC_REGISTRIES}"
      done

# Manually copy signed digests to Docker Hub through artifact-gateway for stable tags.
# Publishing an old release again also resets the v<controller> tags.
publish-ingress-injection-images:
  extends: .ingress-image-publish
  dependencies: [build-ingress-injection-images]
  variables:
    INGRESS_IMAGE_RELEASE_MODE: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: manual
    - when: never

# Manually test publication to ingress-nginx-injection-dev.
# Confirm gateway policy and dev repository setup with Agent Delivery before the first publish.
publish-ingress-injection-images-dev:
  extends: .ingress-image-publish
  dependencies: [build-ingress-injection-images-dev]
  variables:
    INGRESS_IMAGE_RELEASE_MODE: dev
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
    - when: never
