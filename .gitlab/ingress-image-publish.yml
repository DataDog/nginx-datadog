# Build release inputs internally. Public registry credentials stay in public-images.
.ingress-image-source:
  stage: ingress-image-build
  image: $NYDUS_IMAGE
  tags: ["docker-in-docker:$ARCH"]
  parallel:
    matrix:
      - ARCH: ["amd64", "arm64"]
  script:
    - |
      set -euo pipefail
      source_repository="${CI_REGISTRY}/ingress-nginx-injection"
      manifest="ingress-image-manifest/${ARCH}/versions"
      mkdir -p "$(dirname "${manifest}")"
      : > "${manifest}"

      case "${INGRESS_IMAGE_RELEASE_MODE}" in
        release) tag_suffix="dd.${CI_COMMIT_TAG}" ;;
        dev) tag_suffix="dev.${CI_COMMIT_SHORT_SHA}" ;;
        *) echo "Unknown release mode: ${INGRESS_IMAGE_RELEASE_MODE}" >&2; exit 1 ;;
      esac

      for module_dir in artifacts-ingress/"${ARCH}"/*; do
        version="$(basename "${module_dir}")"
        module="${module_dir}/ngx_http_datadog_module.so"
        test -f "${module}"
        image="${source_repository}:v${version}-${tag_suffix}-${ARCH}"
        build_context="$(mktemp -d)"
        cp "${module}" "${build_context}/"
        docker build --progress=plain --no-cache \
          --build-context "build=${build_context}" \
          --platform "linux/${ARCH}" --tag "${image}" \
          injection/ingress-nginx
        docker push "${image}"
        rm -rf "${build_context}"
        echo "${version}" >> "${manifest}"
      done
      test -s "${manifest}"
  artifacts:
    paths:
      - ingress-image-manifest/$ARCH/versions
    expire_in: 1 day

build-ingress-injection-images:
  extends: .ingress-image-source
  # Matrix jobs must be named explicitly for artifact dependencies.
