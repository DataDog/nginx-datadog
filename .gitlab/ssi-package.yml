include:
  - local: ".gitlab/common.yml"

# Assembles RUM-enabled nginx modules (built by build-nginx-rum-* jobs) into
# the directory layout expected by prepare-oci-package.sh / package-oci.
#
# Input  (from build-nginx-rum-fast/all artifacts):
#   artifacts-rum/$ARCH/$NGINX_VERSION/OFF/ngx_http_datadog_module.so
#
# Output (consumed by prepare-oci-package.sh):
#   artifacts/ssi-sources/$ARCH/nginx/$NGINX_VERSION/ngx_http_datadog_module.so
#   artifacts/ssi-sources/$ARCH/version

.ssi-assemble:
  extends: .git-config
  image: $NGINX_CI_BUILD_IMAGE
  stage: assemble
  parallel:
    matrix:
      - ARCH: ["amd64", "arm64"]
  # OK to run on amd64 — this job only copies files, no native compilation
  tags: ["arch:amd64"]
  script:
    - set -euo pipefail
    # Outside a release tag: <last release>-dev.b<branch hash>.glci<pipeline>.g<sha>.
    # Use the pipeline id: both arches must get one version.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        LAST_RELEASE="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
        if [ -z "$LAST_RELEASE" ]; then
          echo "ERROR: no vX.Y.Z tag on origin (or git ls-remote failed, see above)"
          exit 1
        fi
        BRANCH_HASH="$(printf '%s' "$CI_COMMIT_REF_NAME" | sha256sum | cut -c1-6)"
        VERSION="${LAST_RELEASE}-dev.b${BRANCH_HASH}.glci${CI_PIPELINE_ID}.g${CI_COMMIT_SHA:0:8}"
      fi
    - OUTPUT="artifacts/ssi-sources/${ARCH}"
    - mkdir -p "${OUTPUT}"
    - |
      shopt -s nullglob
      dirs=(artifacts-rum/${ARCH}/*/OFF)
      if [ ${#dirs[@]} -eq 0 ]; then
        echo "ERROR: No artifacts found at artifacts-rum/${ARCH}/*/OFF"
        exit 1
      fi
      for dir in "${dirs[@]}"; do
        nginx_ver="$(basename "$(dirname "$dir")")"
        so_file="$dir/ngx_http_datadog_module.so"
        if [ ! -f "$so_file" ]; then
          echo "ERROR: Module not found: $so_file (nginx: $nginx_ver, arch: $ARCH)"
          exit 1
        fi
        mkdir -p "${OUTPUT}/nginx/${nginx_ver}"
        cp "$so_file" "${OUTPUT}/nginx/${nginx_ver}/"
      done
    - echo "${VERSION}" > "${OUTPUT}/version"
    - echo "Assembled modules:" && find "${OUTPUT}" -type f | sort
  artifacts:
    paths:
      - artifacts/ssi-sources/

ssi-build:
  extends: .ssi-assemble
  needs: [build-nginx-rum-fast]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

ssi-build-all:
  extends: .ssi-assemble
  # Don't put 'needs: [build-nginx-rum-all]', because it would exceed the maximum number of jobs allowed as a dependency (50).
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
      when: always
    - when: never
