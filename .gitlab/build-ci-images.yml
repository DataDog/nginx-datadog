include:
  - local: ".gitlab/common.yml"

variables:
  CI_IMAGE_TAG: "buildx-$CI_PIPELINE_ID"

stages:
  - build
  - sign

build-ci-images:
  stage: build
  image: $NYDUS_IMAGE
  tags: ["docker-in-docker:$ARCH"]
  interruptible: false
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  variables:
    CI_ENABLE_CONTAINER_IMAGE_BUILDS: "true"
  script:
    - |
      set -euo pipefail

      daemon_arch=$(docker info --format '{{.Architecture}}')
      case "$ARCH" in
        amd64) expected_arch=x86_64 ;;
        arm64) expected_arch=aarch64 ;;
      esac
      if [ "$daemon_arch" != "$expected_arch" ]; then
        echo "Expected a $expected_arch Docker daemon, got $daemon_arch" >&2
        exit 1
      fi

      for image_name in nginx_musl_toolchain test uwsgi; do
        extra_args=()
        case "$image_name" in
          nginx_musl_toolchain)
            context="build_env"
            extra_args=(--build-arg "MUSL_TOOLCHAIN_IMAGE=$MUSL_TOOLCHAIN_IMAGE")
            ;;
          test)
            context="test"
            ;;
          uwsgi)
            context="test/services/uwsgi"
            ;;
        esac

        image="$CI_REGISTRY/$image_name"
        docker build \
          --provenance=false \
          --sbom=false \
          --progress=plain \
          --platform "linux/$ARCH" \
          "${extra_args[@]}" \
          --tag "$image:${CI_IMAGE_TAG}-$ARCH" \
          "$context"
        docker push "$image:${CI_IMAGE_TAG}-$ARCH"
      done

assemble-and-sign-ci-images:
  stage: sign
  image: $NYDUS_IMAGE
  tags: ["docker-in-docker:amd64"]
  interruptible: false
  needs:
    - build-ci-images
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  script:
    - |
      set -euo pipefail

      for image_name in nginx_musl_toolchain test uwsgi; do
        image="$CI_REGISTRY/$image_name"
        docker buildx imagetools create \
          --tag "$image:${CI_IMAGE_TAG}" \
          "$image:${CI_IMAGE_TAG}-amd64" \
          "$image:${CI_IMAGE_TAG}-arm64"

        digest=$(crane digest "$image:${CI_IMAGE_TAG}")
        ddsign sign "$image:${CI_IMAGE_TAG}@$digest"
        ddsign verify "$image:${CI_IMAGE_TAG}@$digest"

        case "$image_name" in
          nginx_musl_toolchain) variable=NGINX_CI_BUILD_IMAGE ;;
          test) variable=TEST_IMAGE ;;
          uwsgi) variable=UWSGI_TEST_IMAGE ;;
        esac
        printf '%s=%s@%s\n' "$variable" "$image" "$digest" | tee -a ci-images.env
      done
  artifacts:
    paths:
      - ci-images.env
    reports:
      dotenv: ci-images.env
