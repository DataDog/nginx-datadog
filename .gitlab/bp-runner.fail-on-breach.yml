# Measurements from: https://benchmarking.us1.prod.dog/benchmarks?projectId=8
# Thresholds guidance: https://datadoghq.atlassian.net/wiki/x/LgI1LgE

experiments:
  - name: Run SLO breach check
    steps:
      - name: SLO breach check
        run: fail_on_breach
        warning_range: 7
        scenarios:
          - name: high_load/only-tracing
            thresholds:
              - throughput > 3700 op/s
          - name: normal_operation/only-tracing
            thresholds:
              - threshold: agg_http_req_duration_p50 < 0.130 ms
                warning_range: 2
              - agg_http_req_duration_p95 < 0.3 ms
          # RSS is accepted as unstable (intrinsic per-run variation, APMSP-4061); we gate it anyway.
          - name: high_load/only-tracing/nginx-utilization
            thresholds:
              - cpu_usage_percentage < 48.95 %
              - rss < 295007707 bytes
          - name: normal_operation/only-tracing/nginx-utilization
            thresholds:
              - cpu_usage_percentage < 17.14 %
              - rss < 115197198 bytes
